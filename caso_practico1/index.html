<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones de JavaScript</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <span class="etiqueta">PRÁCTICA DE JAVASCRIPT</span>
            <h1>Funciones de JavaScript</h1>
            <p>Completa los datos y ejecuta las funciones para ver sus resultados en la consola.</p>
        </header>

        <form id="calculadora-formulario" class="tarjeta">
            <div class="titulo-tarjeta">
                <h2>Ingresa los datos</h2>
                <p>Los valores se usarán en las funciones relacionadas.</p>
            </div>

            <div class="rejilla-campos">
                <div class="campo">
                    <label for="numero-a">Primer número</label>
                    <input id="numero-a" name="numeroA" type="number" value="10" step="any" required>
                </div>
                <div class="campo">
                    <label for="numero-b">Segundo número</label>
                    <input id="numero-b" name="numeroB" type="number" value="5" step="any" required>
                </div>
                <div class="campo">
                    <label for="edad">Edad</label>
                    <input id="edad" name="edad" type="number" value="20" min="0" required>
                </div>
                <div class="campo">
                    <label for="anio-nacimiento">Año de nacimiento</label>
                    <input id="anio-nacimiento" name="anioNacimiento" type="number" value="1995" min="1" required>
                </div>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" name="nombre" type="text" value="Carlos" required>
                </div>
                <div class="campo">
                    <label for="texto">Texto</label>
                    <input id="texto" name="texto" type="text" value="Hola Mundo" required>
                </div>
                <div class="campo">
                    <label for="numero-paridad">Número para par o impar</label>
                    <input id="numero-paridad" name="numeroParidad" type="number" value="8" step="any" required>
                </div>
                <div class="campo">
                    <label for="numero-c">Tercer número</label>
                    <input id="numero-c" name="numeroC" type="number" value="23" step="any" required>
                </div>
                <div class="campo campo-ancho">
                    <label for="lista-numeros">Números para el promedio <span>(separados por comas)</span></label>
                    <input id="lista-numeros" name="listaNumeros" type="text" value="10, 20, 30, 40" required>
                </div>
                <div class="campo">
                    <label for="fecha-nacimiento">Fecha de nacimiento</label>
                    <input id="fecha-nacimiento" name="fechaNacimiento" type="date" value="1995-06-15" required>
                </div>
                <div class="campo">
                    <label for="longitud-id">Longitud del ID</label>
                    <input id="longitud-id" name="longitudId" type="number" value="10" min="1" max="32" required>
                </div>
            </div>

            <button type="submit">Calcular resultados</button>
        </form>
    </main>

    <script src="../js/matematicas/operaciones.js"></script>
    <script src="../js/texto/cadenas.js"></script>
    <script src="../js/fechas/tiempo.js"></script>
    <script src="../js/validaciones/reglas.js"></script>
    <script src="../js/utilidades/helpers.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
